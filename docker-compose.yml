# Base de datos local para desarrollo. Uso: docker compose up -d
# El superusuario (postgres) solo se usa para inicializar. La app usa el rol "vance",
# que NO es superusuario: así las políticas Row Level Security se aplican de verdad.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres-local-only
    ports:
      - "5432:5432"
    volumes:
      - vance-pg:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
volumes:
  vance-pg:
